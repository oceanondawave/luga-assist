<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Luga Assist Bridge</title>
  <style>
    body {
      width: 280px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 10px 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }
    .btn-sync {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-sync:hover {
      background: #0369a1;
    }
    .notice {
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid #0284c7;
      padding: 6px 8px;
      font-size: 11px;
      color: #7dd3fc;
      border-radius: 4px;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2>🎙️ Luga Assist Bridge</h2>

  <div class="status-card">
    <div class="status-row">
      <span id="agentDot" class="dot"></span>
      <span id="agentStatus">Luga Assist: Đang kiểm tra...</span>
    </div>
    <div class="status-row">
      <span id="geminiDot" class="dot"></span>
      <span id="geminiStatus">Google Session: Đang kiểm tra...</span>
    </div>
  </div>

  <p>Cầu nối tự động đồng bộ phiên Google trên Chrome để Luga Assist chạy ngầm mà không cần mở tab trình duyệt.</p>

  <button id="btnSyncSession" class="btn-sync">
    ⚡ Đồng bộ lại tài khoản Google
  </button>

  <div class="notice">
    💡 Chỉ cần đăng nhập tài khoản Google trên Chrome một lần, hệ thống sẽ tự động duy trì kết nối.
  </div>

  <script src="popup.js"></script>
</body>
</html>
