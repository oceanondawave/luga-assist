name: Build & Release Luga Assist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Standalone (.app, .dmg, .zip)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS App, DMG & ZIP
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/Luga-Assist-macOS.dmg
            dist/Luga-Assist-macOS.zip

  build-windows:
    name: Build Windows Standalone (.exe, .zip, Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows Standalone EXE
        shell: cmd
        run: |
          pyinstaller --clean -y luga_assist_win.spec

      - name: Build Windows Setup Wizard Installer (.exe) with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows\installer.iss

      - name: Create Windows Portable ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\Luga Assist' -DestinationPath 'dist\Luga-Assist-Windows.zip' -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Luga-Assist-Windows-Installer.exe
            dist/Luga-Assist-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Luga-Assist-macOS.dmg
            release-assets/Luga-Assist-macOS.zip
            release-assets/Luga-Assist-Windows-Installer.exe
            release-assets/Luga-Assist-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
